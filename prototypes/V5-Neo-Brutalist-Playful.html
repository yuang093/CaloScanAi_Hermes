<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaloScanAi — Neo-Brutalist Playful</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    :root {
      --bg: #fef9f3;
      --surface: #ffffff;
      --ink: #1a1208;
      --accent: #ff6b35;
      --accent2: #f7c545;
      --accent3: #5bc3eb;
      --shadow: 4px 4px 0px #1a1208;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      max-width: 900px;
      width: 100%;
      border: 3px solid var(--ink);
      box-shadow: var(--shadow);
    }

    .left {
      padding: 56px 48px;
      background: var(--accent);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: var(--ink);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .hero-text h2 {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.05;
      color: var(--ink);
      margin-bottom: 16px;
    }

    .hero-text p {
      font-size: 15px;
      color: rgba(26,18,8,0.7);
      line-height: 1.6;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--ink);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 100px;
      letter-spacing: 0.05em;
    }

    .badge.yellow { background: var(--accent2); color: var(--ink); }
    .badge.blue { background: var(--accent3); color: var(--ink); }

    .right {
      padding: 56px 48px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .form-sub {
      font-size: 13px;
      color: rgba(26,18,8,0.5);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: var(--bg);
      color: var(--ink);
      outline: none;
      transition: box-shadow 0.15s;
    }

    .form-group input:focus {
      box-shadow: var(--shadow);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--ink);
      color: white;
      border: 2px solid var(--ink);
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }

    .btn-primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--ink);
    }

    .form-footer {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: rgba(26,18,8,0.5);
    }

    .form-footer a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .wrapper { grid-template-columns: 1fr; }
      .left { padding: 40px 32px; }
      .right { padding: 40px 32px; }
      .hero-text h2 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="left">
      <div class="logo">
        <div class="logo-icon">📸</div>
        <div class="logo-text">CaloScan</div>
      </div>
      <div class="hero-text">
        <h2>吃什麼<br>AI 幫你看</h2>
        <p>拍照上傳，馬上知道熱量。簡單三步，輕鬆掌握每日飲食。</p>
      </div>
      <div class="badges">
        <div class="badge">🔥 2秒分析</div>
        <div class="badge yellow">📊 數據視覺化</div>
        <div class="badge blue">🔒 100% 隱私</div>
      </div>
    </div>

    <div class="right">
      <div class="form-title">開始使用</div>
      <div class="form-sub">還沒有帳號？<a href="#">立即註冊</a></div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" placeholder="設定密碼">
      </div>

      <button class="btn-primary">登 入</button>
      <div class="form-footer"><a href="#">忘記密碼？</a></div>
    </div>
  </div>
</body>
</html>
