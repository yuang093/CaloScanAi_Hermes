<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaloScanAi — Retro Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Noto+Sans+TC:wght@300;400&display=swap');

    :root {
      --bg: #0a0e0a;
      --ink: #33ff66;
      --ink-dim: #1a7a33;
      --ink-muted: #0d4d1a;
      --accent: #ffcc00;
      --surface: #0d120d;
      --border: #1a331a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--ink-dim);
      background: var(--surface);
      padding: 48px;
    }

    .header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .header-line {
      font-size: 10px;
      color: var(--ink-dim);
      letter-spacing: 0.15em;
      margin-bottom: 4px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.1em;
    }

    .header h1 span { color: var(--accent); }

    .prompt-line {
      font-size: 13px;
      color: var(--ink-dim);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prompt-line::before {
      content: '>';
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      color: var(--ink-dim);
      letter-spacing: 0.2em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 10px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--ink-muted);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-bottom-color: var(--ink);
    }

    .form-group input::placeholder {
      color: var(--ink-muted);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.15s;
    }

    .btn-primary:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .link-row {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }

    .link-row a {
      font-size: 10px;
      color: var(--ink-dim);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .link-row a:hover { color: var(--accent); }

    .footer-note {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 9px;
      color: var(--ink-muted);
      letter-spacing: 0.15em;
      text-align: center;
    }

    .scan-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--ink);
      opacity: 0.1;
      animation: scan 6s linear infinite;
    }

    @keyframes scan {
      0% { top: 0; }
      100% { top: 100vh; }
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.03) 0px,
        rgba(0,0,0,0.03) 1px,
        transparent 1px,
        transparent 2px
      );
    }
  </style>
</head>
<body>
  <div class="scan-line"></div>
  <div class="crt-overlay"></div>

  <div class="container">
    <div class="header">
      <div class="header-line">SYS.CALOSCAN.AI v0.1.0</div>
      <div class="header-line">AUTH_MODULE :: LOADED</div>
      <h1>CALO<span>SCAN</span>_<span style="color:var(--accent)">AI</span></h1>
    </div>

    <div class="prompt-line">執行身份驗證，請輸入憑證</div>

    <div class="form-group">
      <label>EMAIL_INPUT</label>
      <input type="email" placeholder="user@caloscan.ai">
    </div>
    <div class="form-group">
      <label>PASSWORD_INPUT</label>
      <input type="password" placeholder="••••••••">
    </div>

    <button class="btn-primary">[ AUTHENTICATE → ]</button>

    <div class="link-row">
      <a href="#">INIT_NEW_USER</a>
      <a href="#">RECOVER_ACCESS</a>
      <a href="#">ABOUT_SYS</a>
    </div>

    <div class="footer-note">
      // CALORIE TRACKING SYSTEM<br>
      // ENCRYPTED · LOCAL · AI-POWERED
    </div>
  </div>
</body>
</html>
