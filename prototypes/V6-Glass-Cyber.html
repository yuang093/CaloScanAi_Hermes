<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaloScanAi — Glass Cyber</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;600&display=swap');

    :root {
      --bg: #080b14;
      --bg2: #0d1220;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --ink: #e8eaf0;
      --ink-muted: #6b7280;
      --accent: #00d4ff;
      --accent2: #7b61ff;
      --glow: rgba(0,212,255,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridPulse 4s ease-in-out infinite;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0,212,255,0.15), transparent 70%);
      top: -100px;
      right: -100px;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(123,97,255,0.12), transparent 70%);
      bottom: -50px;
      left: -50px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.05); }
    }

    .container {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      max-width: 960px;
      width: 100%;
      padding: 24px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-eyebrow {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      letter-spacing: 0.4em;
      color: var(--accent);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-eyebrow::before {
      content: '';
      width: 24px;
      height: 1px;
      background: var(--accent);
    }

    .brand h1 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(40px, 4vw, 64px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
    }

    .brand h1 .ai {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand h1 .glow {
      text-shadow: 0 0 40px var(--glow);
    }

    .brand p {
      font-size: 14px;
      line-height: 1.9;
      color: var(--ink-muted);
      font-weight: 300;
      max-width: 360px;
      margin-bottom: 40px;
    }

    .feature-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      letter-spacing: 0.15em;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--ink-muted);
      background: var(--surface);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .card-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
    }

    .card-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--ink-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .card-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--ink-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-family: 'Orbitron', monospace;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 24px rgba(0,212,255,0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,212,255,0.4);
    }

    .card-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-muted);
    }

    .card-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
      .brand { text-align: center; }
      .brand p { margin: 0 auto 40px; }
      .feature-pills { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="brand">
      <div class="brand-eyebrow">ARTIFICIAL INTELLIGENCE SYSTEM</div>
      <h1>CALO<br><span class="ai glow">SCAN</span><br>AI</h1>
      <p>用 AI 視覺辨識每一份食物的熱量。拍照上傳，即時分析，輕鬆管理每日飲食攝取。</p>
      <div class="feature-pills">
        <div class="pill">◆ 2SEC ANALYSIS</div>
        <div class="pill">◆ BARCODE SCAN</div>
        <div class="pill">◆ DAILY QUOTE</div>
        <div class="pill">◆ ENCRYPTED</div>
      </div>
    </div>

    <div class="card">
      <div class="card-tabs">
        <div class="card-tab active">LOGIN</div>
        <div class="card-tab">REGISTER</div>
      </div>

      <div class="form-group">
        <label>EMAIL</label>
        <input type="email" placeholder="user@caloscan.ai">
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" placeholder="••••••••">
      </div>

      <button class="btn-primary">AUTHENTICATE →</button>
      <div class="card-footer"><a href="#">FORGOT PASSWORD?</a></div>
    </div>
  </div>
</body>
</html>
