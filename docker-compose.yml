services:
  caloscan_backend:
    build: ./backend
    container_name: caloscan_backend
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://caloscan:${POSTGRES_PASSWORD}@caloscan_postgres:5432/caloscan
      - SECRET_KEY=${SECRET_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./volumes/uploads:/app/uploads
    depends_on:
      caloscan_postgres:
        condition: service_healthy
    networks:
      - caloscan_net

  caloscan_frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://calo_h.yuang093.cc}
    container_name: caloscan_frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://calo_h.yuang093.cc
    depends_on:
      - caloscan_backend
    networks:
      - caloscan_net

  caloscan_postgres:
    image: postgres:16-alpine
    container_name: caloscan_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=caloscan
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=caloscan
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caloscan -d caloscan"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - caloscan_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: caloscan_cloudflared
    restart: unless-stopped
    env_file:
      - .env
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/cloudflared.yml:ro
    networks:
      - caloscan_net

networks:
  caloscan_net:
    driver: bridge